[project]
name = "ampersand-workspace"
version = "0.1.0"
description = "Provider-neutral Ampersand V2 contracts and independent media engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/contracts/python",
  "packages/test-fixtures/python",
  "services/media-worker",
]

[tool.uv.sources]
ampersand-contracts = { workspace = true }
ampersand-test-fixtures = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "packages/contracts/python/tests",
  "services/media-worker/tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["ampersand_contracts", "ampersand_engine", "ampersand_test_fixtures"]
mypy_path = [
  "packages/contracts/python/src",
  "packages/test-fixtures/python/src",
  "services/media-worker/src",
]
