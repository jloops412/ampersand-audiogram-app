[project]
name = "ampersand-media-worker"
version = "0.4.0"
description = "Independent deterministic media worker and local CLI for Ampersand"
requires-python = ">=3.12"
dependencies = [
  "ampersand-contracts",
  "numpy>=2.2,<3",
]

[project.scripts]
ampersand-engine = "ampersand_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ampersand_engine"]

[tool.uv.sources]
ampersand-contracts = { workspace = true }
