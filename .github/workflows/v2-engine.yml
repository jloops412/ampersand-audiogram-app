name: V2 engine

on:
  pull_request:
    paths:
      - ".github/workflows/v2-engine.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "apps/**"
      - "infra/**"
      - "lab/**"
      - "packages/**"
      - "services/**"
      - "scripts/check_v2_boundaries.py"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "THIRD_PARTY_NOTICES.md"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-engine.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "apps/**"
      - "infra/**"
      - "lab/**"
      - "packages/**"
      - "services/**"
      - "scripts/check_v2_boundaries.py"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "THIRD_PARTY_NOTICES.md"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: v2-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native baseline
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Bootstrap pinned uv
        run: |
          python3 -m venv .bootstrap
          .bootstrap/bin/pip install uv==0.11.33
      - name: Install locked workspace
        run: .bootstrap/bin/uv sync --all-packages --dev --locked
      - name: Enforce V2 quarantine
        run: .bootstrap/bin/uv run python scripts/check_v2_boundaries.py
      - name: Lint and format-check
        run: |
          .bootstrap/bin/uv run ruff check packages services lab scripts
          .bootstrap/bin/uv run ruff format --check packages services lab scripts
      - name: Type-check
        run: .bootstrap/bin/uv run mypy
      - name: Test contracts and engine
        run: .bootstrap/bin/uv run pytest
      - name: Verify exported contracts
        run: |
          .bootstrap/bin/uv run --package ampersand-media-worker ampersand-engine schemas --output packages/contracts/schema
          git diff --exit-code -- packages/contracts/schema
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Studio and control dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/worker-control --no-audit --no-fund
      - name: Test and build the private beta
        run: |
          npm run beta:test
          npm run beta:check
          npm run web:test
          npm run build
          cmp THIRD_PARTY_NOTICES.md dist/legal/THIRD_PARTY_NOTICES.md
          cmp infra/licenses/wavesurfer.js-7.12.11-LICENSE.txt dist/legal/wavesurfer.js-7.12.11-LICENSE.txt
      - name: Build the Cloud Run image
        run: docker build --tag ampersand-private-beta:ci .
