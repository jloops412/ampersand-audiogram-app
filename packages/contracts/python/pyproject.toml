[project]
name = "ampersand-contracts"
version = "0.2.0"
description = "Versioned provider-neutral domain contracts for Ampersand"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ampersand_contracts"]
